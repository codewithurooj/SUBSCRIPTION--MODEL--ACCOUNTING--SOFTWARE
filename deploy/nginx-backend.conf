# Nginx reverse proxy for the FastAPI backend running in Docker on 127.0.0.1:8000.
#
# Setup on the VPS:
#   1. Point your domain/subdomain's DNS A record at the VPS's IP address.
#   2. Copy this file to /etc/nginx/sites-available/subscription-backend
#      and edit `server_name` below to your real domain.
#   3. sudo ln -s /etc/nginx/sites-available/subscription-backend /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d api.yourdomain.com
#      (certbot rewrites this file to add the TLS/443 block automatically)

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
